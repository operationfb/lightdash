<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

>
    <head>
        <meta name="x-apple-disable-message-reformatting" />

        <meta charset="utf-8" />
        <meta name="viewport" content="target-densitydpi=device-dpi" />
        <meta content="true" name="HandheldFriendly" />
        <meta content="width=device-width" name="viewport" />
        <style type="text/css">
            [style*='Inter'] {
                font-family:
                    'Inter',
                    BlinkMacSystemFont,
                    Segoe UI,
                    Helvetica Neue,
                    Arial,
                    sans-serif !important;
            }
            [style*='Roboto'] {
                font-family:
                    'Roboto',
                    BlinkMacSystemFont,
                    Segoe UI,
                    Helvetica Neue,
                    Arial,
                    sans-serif !important;
            }
            [style*='Albert Sans'] {
                font-family:
                    'Albert Sans',
                    BlinkMacSystemFont,
                    Segoe UI,
                    Helvetica Neue,
                    Arial,
                    sans-serif !important;
            }
        </style>
    </head>

    <body
        class="t0"

            background-color: #292929;
        "

            <table

                                            text-decoration: none;
                                            text-transform: none;
                                            direction: ltr;
                                            color: #141432;
                                            text-align: left;
                                            mso-line-height-rule: exactly;
                                            mso-text-raise: 2px;
                                        "
                                    >
                                        {{subject}}

                                            text-transform: none;
                                            direction: ltr;

                                            mso-line-height-rule: exactly;

                                        {{description}}

                                                                            Neue,

                                                                    line-height: 22px;

                                                                    direction: ltr;

                                                                    text-align: center;

                                                                <a

                                                                        mso-line-height-rule: exactly;

                                                                    target="_blank"
                                                                    >Contact us</a
                                                                >

                                                    </tr>
                                                </table>
                                            </td>

            </table>
